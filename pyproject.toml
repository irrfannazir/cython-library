[build-system]
requires = ["setuptools", "wheel", "Cython"]  # Cython is required to build
build-backend = "setuptools.build_meta"

[project]
name = "sysdone"  # Choose a UNIQUE name on PyPI
version = "0.1.0"
authors = [{ name = "Irfan Nazir", email = "irrfannazirofficial@gmail.com" }]
description = "A minimal, high-performance Python toolkit built with C and Cython."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "License :: OSI Approved :: MIT License",  # Update if different
    "Operating System :: OS Independent",
]
keywords = ["performance", "cython", "algorithms"]
dependencies = []  # List other pip packages your library needs

[project.urls]
Homepage = "https://github.com/irrfannazir/cython-library"